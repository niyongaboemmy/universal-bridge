name: Lighthouse

# NFR-PERF-02/07: performance, accessibility, best practices and SEO scores
# (lighthouserc.json). Manual only (Actions → Lighthouse → Run workflow): it was
# triggered by every deployment status event (several per production deploy)
# and is meant for checks on demand, not on every release.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to audit (no trailing slash)
        required: true
        default: https://universalbridge.rw

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ inputs.url }}/
            ${{ inputs.url }}/services
            ${{ inputs.url }}/contact
            ${{ inputs.url }}/academy
          configPath: ./lighthouserc.json
          uploadArtifacts: true
