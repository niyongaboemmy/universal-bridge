name: Deploy (cPanel)

# Production deploy to the Namecheap cPanel account (docs/DEPLOYMENT.md).
# Called by CI on every push to main once static checks and unit/integration
# tests pass (ci.yml, job "Deploy"), or run by hand (Actions → Deploy (cPanel)
# → Run workflow) to deploy or roll back to any commit.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch to deploy
        required: true
        default: main

env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}
  # Build-time only. The real secrets live in .env.production on the server.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/build
  PAYLOAD_SECRET: build-only-secret-not-used-at-runtime-0000
  REVALIDATE_SECRET: build
  CRON_SECRET: build
  RATE_LIMIT_SALT: build
  TURNSTILE_SECRET_KEY: build
  EMAIL_FROM: "Universal Bridge <hello@universalbridge.rw>"
  # Inlined into the browser bundle at build time: must be the production values.
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
  NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
  NEXT_PUBLIC_CAL_LINK: ${{ vars.NEXT_PUBLIC_CAL_LINK }}

jobs:
  build:
    name: Build release
    # Only successful CI runs of pushes (merges) to main, or a manual run.
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.meta.outputs.release }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: build }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Check production settings
        run: |
          case "$NEXT_PUBLIC_SITE_URL" in
            https://*) ;;
            *) echo "::error::Set the NEXT_PUBLIC_SITE_URL repository variable (https://…)"; exit 1 ;;
          esac
          [ -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ] || { echo "::error::Set NEXT_PUBLIC_TURNSTILE_SITE_KEY"; exit 1; }
      - id: meta
        run: echo "release=$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Migrations match the collections
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create database schema_migrated" -c "create database schema_pushed"
          MIGRATED_URL=postgres://postgres:postgres@localhost:5432/schema_migrated \
          PUSHED_URL=postgres://postgres:postgres@localhost:5432/schema_pushed \
            bash scripts/check-migrations.sh

      # Pages are prerendered from this empty database; activate.sh refreshes
      # them from the real content right after the switch.
      - run: pnpm db:migrate
      - run: pnpm build
        env: { NEXT_OUTPUT: standalone }
      - run: bash deploy/cpanel/bundle.sh release

      # Run it the way the cPanel server does: outside the checkout (no stray
      # node_modules to fall back on) and with symlinked paths preserved.
      - name: Smoke test the bundle
        env: { PORT: "3000", HOSTNAME: localhost, NODE_PRESERVE_SYMLINKS: "1" }
        run: |
          SMOKE="$RUNNER_TEMP/smoke" && rm -rf "$SMOKE" && cp -a release "$SMOKE"
          (cd "$SMOKE" && node server.js > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health | grep -q '"db":"ok"' && break
            sleep 2
          done
          fail=0
          for p in /api/health / /fr /contact; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-forwarded-proto: https' "http://localhost:3000$p")
            echo "$code $p"
            case "$code" in 5*|000) fail=1 ;; esac
          done
          if [ "$fail" = 1 ] || grep -q "Failed to proxy\|Cannot find module" "$RUNNER_TEMP/server.log"; then
            cat "$RUNNER_TEMP/server.log"; exit 1
          fi

      - run: tar -czf release.tgz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.release }}
          path: release.tgz
          retention-days: 14

  deploy:
    name: Deploy to cPanel
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time; a newer one waits instead of cancelling this one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Add required reviewers to this environment for a manual approval gate.
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    env:
      RELEASE: ${{ needs.build.outputs.release }}
      APP_DIR: ${{ vars.CPANEL_APP_DIR || 'apps/universalbridge' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "release-${{ needs.build.outputs.release }}" }

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host cpanel
            HostName ${{ secrets.CPANEL_SSH_HOST }}
            Port ${{ secrets.CPANEL_SSH_PORT || '21098' }}
            User ${{ secrets.CPANEL_SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            PasswordAuthentication no
            StrictHostKeyChecking yes
            ConnectTimeout 30
            ServerAliveInterval 30
          EOF

      # One SSH login per deploy: the server's firewall blocks an IP for a while
      # after a few logins in quick succession. Exit code 255 means ssh itself
      # could not connect, so only then wait and try again.
      - name: Upload and activate (health check, automatic rollback)
        run: |
          for attempt in 1 2 3 4; do
            set +e
            ssh cpanel "set -e; mkdir -p '$APP_DIR/releases/$RELEASE'; \
              tar -xzf - -C '$APP_DIR/releases/$RELEASE'; \
              APP_ROOT=\$HOME/$APP_DIR bash '$APP_DIR/releases/$RELEASE/deploy/activate.sh' '$RELEASE'" < release.tgz
            code=$?
            set -e
            [ "$code" -ne 255 ] && exit "$code"
            echo "SSH connection failed (attempt $attempt); retrying in 2 minutes"
            sleep 120
          done
          exit 255
